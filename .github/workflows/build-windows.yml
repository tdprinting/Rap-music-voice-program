name: Build SIB Studio Mixer (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller
      - name: Engine tests
        run: python -m pytest -q tests
      - name: GUI smoke test (opens and closes the studio)
        env:
          QT_QPA_PLATFORM: offscreen
          SIB_SMOKE_TEST: "1"
        run: python -m sib_studio
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name "SIB Studio Mixer"
          --icon assets\sib.ico --add-data "assets;assets" --add-data "sib_studio/data;sib_studio/data"
          --collect-all _soundfile_data --collect-all _sounddevice_data
          --collect-submodules scipy.signal --collect-submodules scipy.ndimage
          run_sib.py
      - name: Zip
        run: Compress-Archive -Path "dist\SIB Studio Mixer" -DestinationPath "SIB-Studio-Mixer-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SIB-Studio-Mixer-Windows
          path: SIB-Studio-Mixer-Windows.zip
      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SIB-Studio-Mixer-Windows.zip
